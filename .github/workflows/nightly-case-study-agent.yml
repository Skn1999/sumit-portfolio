name: Nightly Task Runner Agent

on:
  schedule:
    # Runs every night at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      task_file:
        description: "Specific task file path (optional, e.g. tasks/task_add_product_hunt_badge.md)"
        required: false
        default: ""

jobs:
  run-tasks:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code (Staging Base)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Locate Pending Tasks
        id: locate_tasks
        run: |
          if [ -n "${{ github.event.inputs.task_file }}" ]; then
            echo "TASKS=${{ github.event.inputs.task_file }}" >> $GITHUB_OUTPUT
            echo "FOUND=true" >> $GITHUB_OUTPUT
          else
            FILES=$(find tasks -name "*.md" ! -name "TODOS.md" 2>/dev/null | tr '\n' ' ')
            if [ -n "$FILES" ]; then
              echo "TASKS=$FILES" >> $GITHUB_OUTPUT
              echo "FOUND=true" >> $GITHUB_OUTPUT
            else
              echo "TASKS=" >> $GITHUB_OUTPUT
              echo "FOUND=false" >> $GITHUB_OUTPUT
              echo "No pending tasks found in tasks/"
            fi
          fi

      - name: Execute Task Runner Agent
        if: steps.locate_tasks.outputs.FOUND == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Starting Task Runner Agent..."
          echo "Tasks to process: ${{ steps.locate_tasks.outputs.TASKS }}"

          for TASK_FILE in ${{ steps.locate_tasks.outputs.TASKS }}; do
            echo "=========================================="
            echo "Running Task Runner Agent on: $TASK_FILE"
            echo "Primary spec: .agent/task-runner-agent.md"
            echo "Task Runner Agent will evaluate if job requires invoking .agent/case-study-rewriter-agent.md"
            echo "=========================================="
            
            # Execute Task Runner Agent Script
            node scripts/run-task-agent.js "$TASK_FILE"
          done

      - name: Verify Build
        if: steps.locate_tasks.outputs.FOUND == 'true'
        run: npm run build

      - name: Check for file changes
        id: changes
        if: steps.locate_tasks.outputs.FOUND == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            echo "Detected repository changes after task execution."
            git status --short
          else
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes detected after task execution."
          fi

      - name: No-op summary (no changes)
        if: steps.locate_tasks.outputs.FOUND == 'true' && steps.changes.outputs.HAS_CHANGES == 'false'
        run: |
          echo "Tasks were processed, but no file changes were generated."
          echo "Skipping pull request creation."

      - name: Create Pull Request
        if: steps.locate_tasks.outputs.FOUND == 'true' && steps.changes.outputs.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): automated task execution via task-runner-agent"
          title: "🤖 Agent: Task Runner Execution & Integration"
          body: |
            ## Nightly Task Runner Agent Execution

            Automated task execution processed by `.agent/task-runner-agent.md`.

            ### Task Execution Summary:
            - **Primary Agent**: `.agent/task-runner-agent.md`
            - **Delegated Agents (if applicable)**: `.agent/case-study-rewriter-agent.md`

            ### Tasks Processed:
            `${{ steps.locate_tasks.outputs.TASKS }}`

            ---
            *Automated by GitHub Actions & Antigravity Task Runner Workflow.*
          base: staging
          branch: agent/task-execution
          delete-branch: true
          labels: |
            agent-generated
            task-runner

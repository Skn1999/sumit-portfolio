name: Nightly Case Study Rewriter Agent

on:
  schedule:
    # Runs every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Specific task file path (optional, e.g. tasks/case-studies/task_ediaqi_case_study_rewrite.md)'
        required: false
        default: ''

jobs:
  rewrite-case-studies:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code (Staging Base)
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Locate Pending Case Study Tasks
        id: locate_tasks
        run: |
          if [ -n "${{ github.event.inputs.task_file }}" ]; then
            echo "TASKS=${{ github.event.inputs.task_file }}" >> $GITHUB_OUTPUT
            echo "FOUND=true" >> $GITHUB_OUTPUT
          elif ls tasks/case-studies/*.md 1> /dev/null 2>&1; then
            FILES=$(ls tasks/case-studies/*.md | tr '\n' ' ')
            echo "TASKS=$FILES" >> $GITHUB_OUTPUT
            echo "FOUND=true" >> $GITHUB_OUTPUT
          else
            echo "TASKS=" >> $GITHUB_OUTPUT
            echo "FOUND=false" >> $GITHUB_OUTPUT
            echo "No pending case study tasks found in tasks/case-studies/"
          fi

      - name: Execute Case Study Rewriter Agent
        if: steps.locate_tasks.outputs.FOUND == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting Case Study Rewriter Agent..."
          echo "Tasks to process: ${{ steps.locate_tasks.outputs.TASKS }}"
          
          for TASK_FILE in ${{ steps.locate_tasks.outputs.TASKS }}; do
            echo "=========================================="
            echo "Running Agent on: $TASK_FILE"
            echo "Using instructions from: .agent/case-study-rewriter-agent.md"
            echo "Context files:"
            echo "  - .agent/benchmark-framework.md"
            echo "  - .agent/ui-building-instructions.md"
            echo "  - .agent/architecture.md"
            echo "  - .agent/tech-stack.md"
            echo "  - .agent/progress.md"
            echo "  - .agent/learnings.md"
            echo "=========================================="
            
            # Execute Node Agent Script using Gemini API
            node scripts/run-case-study-agent.js "$TASK_FILE"
          done

      - name: Verify Build
        if: steps.locate_tasks.outputs.FOUND == 'true'
        run: npm run build

      - name: Create Pull Request
        if: steps.locate_tasks.outputs.FOUND == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(agent): automated case study rewrite via recruiter benchmark framework'
          title: '🤖 Agent: Nightly Case Study Rewrite & Integration'
          body: |
            ## Nightly Case Study Rewriter Agent Execution
            
            Automated case study rewrite processed by `.agent/case-study-rewriter-agent.md`.
            
            ### Context Files Applied:
            - 📖 **Storytelling Framework**: `.agent/benchmark-framework.md`
            - 🎨 **Portfolio UI Rules**: `.agent/ui-building-instructions.md`
            
            ### Tasks Processed:
            `${{ steps.locate_tasks.outputs.TASKS }}`
            
            ---
            *Automated by GitHub Actions & Antigravity Agent Workflow.*
          base: staging
          branch: agent/case-study-rewrite
          delete-branch: true
          labels: |
            agent-generated
            case-study

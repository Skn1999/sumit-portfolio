name: Build & Deploy Tack Lab

on:
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "preview"

  # Uncomment below in the future when you want fully automated deployment on push:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/labs/flow/**'
  #     - 'packages/**'
  #     - '.github/workflows/deploy-tack.yml'

concurrency:
  group: "deploy-tack-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Tack Standalone Lab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Tack Lab
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build:tack

      - name: Verify Build Output
        run: |
          test -f apps/labs/flow/dist/index.html || { echo "❌ Tack build failed: dist/index.html missing"; exit 1; }
          echo "✅ Tack standalone build verified successfully!"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tack-dist
          path: apps/labs/flow/dist
          retention-days: 14

  # Optional Vercel Deployment Step:
  # If you add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in your GitHub Repo Secrets,
  # this step will automatically push the standalone build to tack.sumitknayyar.com.
  deploy-vercel:
    name: Deploy to Vercel (Optional)
    needs: build
    runs-on: ubuntu-latest
    if: false # Flip to true once VERCEL secrets are configured in repository settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: tack-dist
          path: apps/labs/flow/dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/labs/flow
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}
